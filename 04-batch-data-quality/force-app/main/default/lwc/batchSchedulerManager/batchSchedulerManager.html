<template>
    <lightning-card title="Batch Scheduler Manager"
                    icon-name="standard:apex_plugin">
        <div class="slds-p-around_medium">

            <!-- 1. Batch class selection -->
            <lightning-combobox
                label="Select Batch"
                value={selectedBatch}
                placeholder="-- Select a Batch --"
                options={batchOptions}
                onchange={handleBatchChange}>
            </lightning-combobox>

            <!-- 2. Launch time selection -->
            <lightning-combobox
                label="Select Launch Time"
                value={selectedTime}
                placeholder="-- Select a time --"
                options={timeOptions}
                onchange={handleTimeChange}>
            </lightning-combobox>

            <!-- 3. Buttons -->
            <div class="slds-m-top_medium">
                <lightning-button
                    label="Launch"
                    variant="brand"
                    onclick={handleLaunch}
                    class="slds-m-right_small">
                </lightning-button>

                <lightning-button
                    label="Stop"
                    variant="destructive"
                    onclick={handleStop}>
                </lightning-button>
            </div>

            <!-- 4. Status -->
            <div class="slds-m-top_medium">
                <p><strong>Status:</strong> {jobStatus}</p>
            </div>

        </div>
    </lightning-card>
</template>
