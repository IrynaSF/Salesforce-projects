<template>
    <lightning-card title="Follow-up Opportunity Generator" icon-name="standard:apex_plugin">
        <div class="slds-m-around_medium">
            
            <!-- Выбор времени -->
            <lightning-combobox
                label="Launch Time"
                options={timeOptions}
                onchange={handleTimeChange}>
            </lightning-combobox>

            <!-- Две кнопки управления -->
            <div class="slds-m-top_medium">
                <lightning-button label="Launch Job" onclick={handleLaunch} class="slds-m-right_small"></lightning-button>
                <lightning-button label="Stop Job" variant="destructive" onclick={handleStop}></lightning-button>
            </div>

            <!-- Сюда выводится статус из @wire -->
            <div class="slds-m-top_medium slds-text-heading_small">
                {resultMessage}
            </div>

        </div>
    </lightning-card>
</template>
