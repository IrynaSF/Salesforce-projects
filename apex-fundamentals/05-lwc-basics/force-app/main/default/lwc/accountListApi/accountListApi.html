<template>    
<lightning-card title="List of Accounts">
        <div class="slds-p-around_medium">
            <!-- 1. Iterate over the accounts array -->
            <template for:each={accounts} for:item="acc">
                
                <!-- 2. Render the child accountCard component -->
                <!-- Pass the account data into the account-data attribute -->
                <c-account-card-api
                    key={acc.Id} 
                    account={acc}>
                </c-account-card-api>

            </template>
        </div>
    </lightning-card>
</template>
