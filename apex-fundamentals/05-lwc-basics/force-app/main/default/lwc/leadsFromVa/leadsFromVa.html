<template>

   <lightning-button 
   variant="success" 
   label="Leads From Virginia" 
   title="Successful action" 
   onclick={handleLoad} 
   class="slds-m-left_x-small">
</lightning-button>

<!-- text status indicator: shows the user what is happening right now. -->
<p>{status}</p>

<!-- Here we take data from JS to show on the page; the HTML picks it up via {leads} and renders it with a for:each loop. -->
<template lwc:if={hasLeads}>
                <template for:each={leads} for:item="lead">
                    <div key={lead.Id} class="slds-box slds-var-m-around_small">
                        <p><strong>Name:</strong> {lead.fullName}</p>
                        <p><strong>Status:</strong> {lead.Status}</p>

                        </div>
    
</template>
</template>
</template>
