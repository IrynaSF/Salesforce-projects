<template>
    <!-- lightning-card: a card with a header -->
    <!-- title: the card header text -->
    <lightning-card title="Student List">
        <div class="slds-p-around_medium">

            <!-- ══════════════════════════════ -->
            <!-- CONTROL BUTTONS              -->
            <!-- ══════════════════════════════ -->
            <div class="slds-m-bottom_medium">

                <!-- Button to add a new student -->
                <!-- onclick={handleAdd} calls handleAdd() in JS -->
                <lightning-button
                    label="Add David"
                    onclick={handleAdd}
                    class="slds-m-right_small">
                </lightning-button>

                <!-- Button to update Linda's grade -->
                <!-- onclick={handleUpdate} calls handleUpdate() in JS -->
                <lightning-button
                    label="Update Linda"
                    onclick={handleUpdate}
                    class="slds-m-right_small">
                </lightning-button>

                <!-- Button to sort by grade -->
                <!-- onclick={handleSort} calls handleSort() in JS -->
                <lightning-button
                    label="Sort by Grade"
                    onclick={handleSort}>
                </lightning-button>
            </div>

            <!-- ══════════════════════════════ -->
            <!-- STUDENT LIST               -->
            <!-- ══════════════════════════════ -->

            <!-- for:each={students} iterates over each element of the students array -->
            <!-- for:item="student": each element is called student -->
            <!-- Result: an HTML block is created for EACH student -->
            <template for:each={students} for:item="student">

                <!-- key={student.id} is required for for:each -->
                <!-- LWC uses the key to track changes -->
                <div key={student.id} class="slds-box slds-m-bottom_small">

                    <!-- {student.name} shows the current student's name -->
                    <!-- For example: Linda, Bob, Clara -->
                    <p><strong>Name:</strong> {student.name}</p>

                    <!-- {student.grade} shows the grade -->
                    <!-- For example: 85, 42, 91 -->
                    <p><strong>Grade:</strong> {student.grade}</p>

                    <!-- {student.active} shows true or false -->
                    <p><strong>Active:</strong> {student.active}</p>

                    <!-- Delete button for each student -->
                    <!-- variant="destructive": red button -->
                    <!-- data-id={student.id}: store the student id on the button -->
                    <!-- When Delete is clicked, JS knows which id to remove -->
                    <!-- onclick={handleDelete} calls handleDelete() in JS -->
                    <lightning-button
                        label="Delete"
                        variant="destructive"
                        data-id={student.id}
                        onclick={handleDelete}>
                    </lightning-button>

                </div>
            </template>

        </div>
    </lightning-card>
</template>
