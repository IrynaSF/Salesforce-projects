<template>
   
    <!--для статуса-->
    <p>{status}</p>

    <!--для вывода списка Training записей -->
      <template lwc:if={trainings.data}>
                <template for:each={trainings.data} for:item="training">
                    <div key={training.Id} class="slds-box slds-var-m-bottom_small">
                        <p><strong>Name:</strong> {training.Name}</p>
                        <p><strong>Course:</strong> {training.Course_Name__c}</p>
                        <p><strong>Status:</strong> {training.Status__c}</p>

                        <!--Кнопка для изменения статуса по одному на каждую запись-->
    <lightning-button variant="brand"
     label="Mark as Completed" 
      data-id={training.Id}
     onclick={handleClick} 
     class="slds-m-left_x-small">
    </lightning-button>
    
                </div>
       </template>
    </template>
</template>
