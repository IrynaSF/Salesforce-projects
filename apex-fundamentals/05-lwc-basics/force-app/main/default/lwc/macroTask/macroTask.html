<template>
    <!---Кнопка-->
    
    <lightning-button variant="brand" label="Load Account" 
     onclick={handleLoad} class="slds-m-left_x-small"></lightning-button>

  <!--Наша переменная со статусом -->
    <p>{status}</p>

<!--Для отображения списка элементов используйте for:each-->
    <template for:each={accounts} for:item="account">

        <!--key={account.Id} — уникальный ключ для каждого элемента {account.Name} — имя аккаунта-->
        <p key={account.Id}>{account.Name}</p>
    </template>
</template>
